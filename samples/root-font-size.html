<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Root typography regression</title>
  <style>
    .report-scope { font-size: 19px; }
    #report.report-scope > h2 { font-size: 42px; }
  </style>
</head>
<body>
<main id="report" class="report-scope">
  <h2 id="styled-heading">Root-scoped heading</h2>
  <p id="styled-paragraph">This paragraph inherits a nineteen-pixel font from its report container.</p>
</main>
</body>
</html>
