<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分寸 · 分页评审台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/ui.mjs"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1><span>分寸</span> 分页评审台</h1>
    <div class="session" hidden>
      <span id="progress" aria-live="polite"></span>
      <button type="button" id="change" class="link-button">换评审人</button>
    </div>
  </div>
</header>
<main>
  <form id="login" class="welcome">
    <label for="reviewer">评审人名字</label>
    <p>同一个名字可以接着评。请为每位评审人使用不同的名字。</p>
    <div class="entry">
      <input id="reviewer" name="reviewer" maxlength="60" required autocomplete="off">
      <button type="submit" id="start">开始评审</button>
    </div>
    <p><a href="/?mode=pilot" id="mode-link">改做试评（40 组）</a></p>
  </form>
  <section id="review" hidden aria-label="分页对比">
    <div class="pair">
      <section class="column" aria-labelledby="left-title">
        <h2 id="left-title">左边</h2>
        <div id="left"></div>
      </section>
      <section class="column" aria-labelledby="right-title">
        <h2 id="right-title">右边</h2>
        <div id="right"></div>
      </section>
    </div>
    <div class="vote-wrap">
      <div class="votes" aria-label="选择偏好">
        <button type="button" data-vote="left">左边好 <kbd>1</kbd></button>
        <button type="button" data-vote="tie" class="secondary">差不多 <kbd>2</kbd></button>
        <button type="button" data-vote="right">右边好 <kbd>3</kbd></button>
      </div>
    </div>
  </section>
  <p id="complete" class="welcome" hidden>可用的比较已全部评完。</p>
  <p id="status" class="status" role="status" hidden></p>
</main>
<dialog id="preview">
  <div class="preview-bar"><button type="button" class="secondary" id="close-preview">关闭预览</button></div>
  <img id="preview-page" alt="">
</dialog>
</body>
</html>
