name: Deploy Unsliced Web redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'redirect/**'
      - 'README.md'
      - 'README.zh-CN.md'

permissions:
  contents: read

concurrency:
  group: unsliced-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare root and deep-path redirect pages
        run: |
          mkdir -p output/redirect
          cp redirect/index.html redirect/redirect.js output/redirect/
          cp redirect/index.html output/redirect/404.html
          touch output/redirect/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
