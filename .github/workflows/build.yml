name: Build and Test

on:
  push:
    branches: [ "main", "master", "release-prep" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UNSLICED_PYTHON: python

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set a new browser cache for this job
      shell: bash
      run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/unsliced-first-chromium" >> "$GITHUB_ENV"

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Type check
      run: pnpm typecheck

    - name: Run unit tests
      run: pnpm test:unit

    - name: Set up Python for PDF text verification
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PDF inspection tools
      run: python -m pip install -r scripts/requirements.txt

    - name: Install Linux browser system libraries
      if: runner.os == 'Linux'
      run: pnpm exec playwright install-deps chromium

    - name: Pack standalone npm package
      run: node scripts/pack-mcp.mjs

    - name: Install package outside the workspace
      shell: bash
      run: npm install --prefix "$RUNNER_TEMP/unsliced-pack-test" ./output/npm/unsliced-pdf-mcp-0.1.2.tgz

    - name: Run packed MCP PDF acceptance with first browser download
      run: pnpm test:mcp
      env:
        UNSLICED_USE_BUNDLED_BROWSER: '1'
        UNSLICED_TEST_MCP_ENTRY: ${{ runner.temp }}/unsliced-pack-test/node_modules/unsliced-pdf-mcp/dist/server.mjs

    - name: Run browser tests
      run: pnpm test:browser

    - name: Run sample acceptance checks
      run: pnpm acceptance
