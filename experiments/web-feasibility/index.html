<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'self'; frame-src 'self' about:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Unsliced · 网页可行性测试</title>
<link rel="stylesheet" href="./ui.css">
<script defer src="./breakflow.js"></script>
<script type="module" src="./app.js"></script>
<body>
<section id="web-controls">
  <h1>Unsliced · 网页可行性测试</h1>
  <label for="markdown">粘贴 Markdown（图片须内嵌，不支持直接输入 HTML）</label>
  <textarea id="markdown" rows="6"></textarea>
  <label>中文字体 <select id="font"><option value="A">A · 系统字体</option><option value="B">B · 按需下载字体</option></select></label>
  <button id="render" type="button">分页预览</button>
  <button id="print" type="button" disabled>打印 / 存为 PDF</button>
  <small>打印时请选 A4、100%，关闭页眉页脚。</small>
  <p id="status" role="status">请粘贴 Markdown，或从下方载入样例。</p>
  <details><summary>测试入口：载入样例</summary>
    <label>样例 <select id="samples"><option value="">请选择</option></select></label>
    <button id="sample" type="button" disabled>载入并分页</button>
  </details>
</section>
</body>
</html>
